# JasperReports font extension. The report templates are ported from legacy and name Arial, which a
# Linux container does not have; Jasper refuses a font the JVM cannot find. Liberation Sans is the
# open-licence font drawn to Arial's metrics, so legacy's column widths still fit what they hold.
net.sf.jasperreports.extension.registry.factory.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.arial=fonts/arial.xml
