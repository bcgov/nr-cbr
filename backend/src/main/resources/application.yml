# CBR backend configuration.
#
# Derived from nr-frep's application.yml — the load-bearing parts are carried over verbatim
# (Oracle TCPS datasource, the NLS_NUMERIC_CHARACTERS pin, Cognito resource-server wiring, actuator
# exposure, CORS). FREP-only blocks (open-maps, ClamAV, the one-time BLOB migration tooling) are not
# carried; add them when the equivalent CBR features land.

server:
  servlet:
    context-path: /
  error:
    include-message: always
  # SERVER_PORT placeholder so application-local.yml and the OpenShift env var can override.
  port: ${SERVER_PORT:3000}
  shutdown: graceful
  max-http-request-header-size: 16KB
  undertow:
    # Connector-level request-body backstop, above spring.servlet.multipart.max-request-size so the
    # multipart layer is normally what rejects an oversized upload with a field-level message.
    # Sized by heap, not by the connector: attachment bytes are held as a byte[] and the JVM runs
    # -Xmx400m under -XX:+ExitOnOutOfMemoryError, so an oversized upload kills the pod.
    max-http-post-size: ${MAX_HTTP_POST_SIZE:52428800}
  # Honour X-Forwarded-* from the Caddy reverse proxy when reconstructing the request URL. Without
  # this Spring sees the in-cluster Host and treats the browser Origin as cross-origin.
  forward-headers-strategy: framework

spring:
  application:
    name: cbr-backend
  servlet:
    multipart:
      # Inspection photos and as-built drawings. file-size-threshold stays at its 0 default so every
      # part spools to a temp file under java.io.tmpdir rather than buffering in memory — which makes
      # the /tmp emptyDir mount in openshift.deploy.yml load-bearing under readOnlyRootFilesystem.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:17MB}
  datasource:
    url: "jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCPS)(HOST=${DATABASE_HOST})(PORT=${DATABASE_PORT:1543}))(CONNECT_DATA=(SERVICE_NAME=${DATABASE_SERVICE_NAME})(SERVER=DEDICATED)))"
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Pin the decimal separator for every pooled connection.
      #
      # Carried over from nr-frep, where its absence caused ORA-06502 on every decimal value. The
      # same exposure exists here: the CBR packages take numeric parameters that arrive through
      # implicit VARCHAR2 -> NUMBER conversion, which runs under the session's
      # NLS_NUMERIC_CHARACTERS — derived from the JVM default locale unless set. Where the decimal
      # separator is not ".", whole numbers save and decimals fail. CBR has plenty of decimals
      # (channel measurements, span lengths, slope, cover depths, lat/long, UTM).
      #
      # Value is decimal separator then group separator: "." and "," — the ANSI default.
      connection-init-sql: "ALTER SESSION SET NLS_NUMERIC_CHARACTERS = '.,'"
      data-source-properties:
        javax.net.ssl.trustStoreType: JKS
        javax.net.ssl.trustStore: ${TRUSTSTORE_PATH:/cert/jssecacerts}
        javax.net.ssl.trustStorePassword: ${KEYSTORE_SECRET}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # BC Gov SSO (Keycloak) standard realm, e.g.
          # https://test.loginproxy.gov.bc.ca/auth/realms/standard
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          # Keycloak publishes its keys at /protocol/openid-connect/certs — NOT the
          # /.well-known/jwks.json path Cognito used. Pointing at the latter 404s, which surfaces as
          # a blanket 401 on every request rather than as a configuration error.
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

management:
  enable-native-support: true
  endpoints:
    web:
      exposure:
        # health + prometheus only — the probes and the Prometheus scrape. These two are the
        # anonymous endpoints named individually in ApiAuthorizationCustomizer; keep the two lists
        # in step.
        include: "health,prometheus"
  endpoint:
    metrics:
      enabled: false
    health:
      # The probes only check the status code, so component detail was published to no one.
      show-details: never

# Application metadata. Read through @Value, not the Actuator /info endpoint (not exposed).
info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    zone: ${APP_ZONE:local}

cbr:
  # The legacy PL/SQL packages this app calls. Business logic stays in the database — see
  # docs/legacy-cbr-overview.md §7 and §16. Deployed from bcgov-c/nr-mof-db, not from this repo.
  package-name: CBR
  general-package-name: CBR_GENERAL
  reporting-package-name: CBR_REPORTING
  admin-package-name: CBR_ADMIN
  # These two are PACKAGE names, not roles. The packages are live — CBR_REGIONAL_ENGINEER holds the
  # nine destructive procedures and CBR_CONTRACT_REGIONAL_ENGINEER holds UPDATE_SITE — but the roles
  # they were named after were retired in WebADE long ago, and CBR has no region scoping of any kind.
  # See cbr-auth-and-roles.local.md §3.1.
  regional-engineer-package-name: CBR_REGIONAL_ENGINEER
  contract-engineer-package-name: CBR_CONTRACT_REGIONAL_ENGINEER
  # S3-compatible object storage for inspection attachments. Replaces the CROSSING_STRUCTURE_FILE
  # BLOBs; the legacy data is a separate migration.
  object-storage:
    host: ${OBJECT_STORAGE_HOST:}
    bucket: ${OBJECT_STORAGE_BUCKET:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  # ConsignO e-signature — P.Eng sealing of reviewed inspection reports. No nr-frep precedent.
  # Secrets come from the environment; the legacy app committed them to application.properties.
  # See docs/legacy-cbr-overview.md §14.
  consigno:
    enabled: ${CONSIGNO_ENABLED:false}
    base-url: ${CONSIGNO_BASE_URL:}
    api-key: ${CONSIGNO_API_KEY:}
    secret: ${CONSIGNO_SECRET:}

resilience4j:
  circuitbreaker:
    instances:
      breaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      apiRetry:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

ca:
  bc:
    gov:
      nrs:
        environment: ${APP_ZONE:local}
        keycloak:
          # The CSS integration's client id. Validated as the token's `azp` — the standard realm is
          # shared across BC Gov applications, so issuer + signature alone do not prove a token was
          # minted for CBR. Differs per environment, hence configuration rather than a constant.
          client-id: ${KEYCLOAK_CLIENT_ID}
        # nr-user-lookup-api — the shared BC Gov IDIR directory. Replaces the FAM identity-lookup
        # integration: FAM still administers the CBR roles, it is just no longer the directory.
        # Calls authenticate with CBR's OWN client_credentials service account, not the caller's
        # token, because that is what nr-user-lookup-api validates.
        #
        # CBR's first consumer will be inspection-reviewer administration (Phase 6), which today
        # resolves reviewers from STRUCTURE_INSPECTION_REVIEWER rows keyed by userid.
        #
        # Set all of token-url / client-id / client-secret, or none — a partial trio fails fast at
        # startup. Unset means an unauthenticated client and an empty directory, which is how PR
        # previews run.
        user-lookup:
          base-url: ${USER_LOOKUP_BASE_URL:}
          token-url: ${USER_LOOKUP_TOKEN_URL:}
          client-id: ${USER_LOOKUP_CLIENT_ID:}
          client-secret: ${USER_LOOKUP_CLIENT_SECRET:}
          # Optional — the scopes are DEFAULT client scopes on the service account, so normally
          # left blank.
          scope: ${USER_LOOKUP_SCOPE:}
          connect-timeout: 15s
          read-timeout: 30s
        user-directory:
          default-page-size: 25
        frontend:
          url: ${FRONTEND_URL:http://localhost:3000}

# Logging — Spring Boot default stack (SLF4J + Logback). Per-category levels default to INFO;
# override at runtime via env vars (relaxed binding maps UPPERCASE_WITH_UNDERSCORES -> dot.case):
#   APP_LOG_LEVEL          -> ca.bc.gov.nrs.cbr
#   HIKARI_LOG_LEVEL       -> com.zaxxer.hikari
#   ORACLE_JDBC_LOG_LEVEL  -> oracle.jdbc
#   LOGGING_LEVEL_ROOT     -> root logger
logging:
  level:
    ca.bc.gov.nrs.cbr: ${APP_LOG_LEVEL:INFO}
    com.zaxxer.hikari: ${HIKARI_LOG_LEVEL:INFO}
    oracle.jdbc: ${ORACLE_JDBC_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name}] [%X{X-TRACE-ID:-},${PID:-}] [%t] %logger:%L - %m%n%wEx"
